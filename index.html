<style>
  :root {
    --panel: rgba(255, 250, 242, .92); --ink: #2b2118; --muted: #7a6a58; --line: #e2d6c3;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(34, 28, 22, .92); --ink: #f1e7d8; --muted: #a8977f; --line: #3a3027;

    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(34, 28, 22, .92); --ink: #f1e7d8; --muted: #a8977f; --line: #3a3027;
    --accent: #d08a4f; --accent-ink: #1a120b; --bg: #1b1713;

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.4 "PT Sans", system-ui, sans-serif; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(6px); }
  h1 { margin: 0; font: 700 26px "PT Serif", Georgia, serif; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .status { font-weight: 700; margin: 8px 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px 6px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 14px 0 4px; }
  ol { margin: 0; padding-left: 22px; font-size: 13px; max-height: 180px; overflow: auto; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .counts { font-size: 13px; margin-top: 10px; color: var(--muted); }
  .counts b { color: var(--ink); }
  .rules { margin: 0; padding-left: 18px; font-size: 13px; }
  .rules li { margin-bottom: 4px; }
  .tip { position: fixed; pointer-events: none; background: rgba(20, 14, 8, .88); color: #f6ead6; padding: 5px 9px; border-radius: 7px; font-size: 13px; display: none; white-space: nowrap; z-index: 5; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 20px "PT Serif", serif; color: var(--muted); pointer-events: none; }
  .intro { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 4; }
  .intro::before, .intro::after { content: ''; position: absolute; left: 0; right: 0; height: 9vh; background: #0b0703; }
  .intro::before { top: 0; } .intro::after { bottom: 0; }
  .intro button { pointer-events: auto; }

  .cap .ru { font-size: clamp(14px, 1.7vw, 19px); margin-top: 6px; opacity: .9; }
  .cityname { position: absolute; left: 50%; top: calc(9vh + 30px); transform: translateX(-50%); font: 700 clamp(22px, 3.4vw, 40px) "PT Serif", serif;

  .cityname.on { opacity: 1; }
  .ititle { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  .ititle.on { opacity: 1; background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(25,12,2,.62), rgba(25,12,2,0) 75%); }
  .ititle.on button { pointer-events: auto; }
  .ititle h1 { font: 700 clamp(46px, 8vw, 104px) "PT Serif", Georgia, serif; color: #fff3dc; letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(60,25,0,.8), 0 0 3px rgba(0,0,0,.6); }
  .ititle p { color: #ffeccc; font-size: clamp(15px, 2vw, 22px); margin: 0 0 14px; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .ititle button { justify-self: center; font-size: 18px; padding: 12px 26px; border-radius: 30px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }  .gate { position: fixed; inset: 0; z-index: 6; display: grid; place-content: center; text-align: center; gap: 12px;
    background: radial-gradient(ellipse at 50% 45%, rgba(40,20,6,.72), rgba(10,5,1,.92)); color: #fff3dc; }
  .gate h1 { font: 700 clamp(46px, 8vw, 104px) "PT Serif", Georgia, serif; margin: 0; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  .gate p { margin: 0 0 16px; font-size: clamp(15px, 2vw, 22px); color: #ffeccc; }
  .gate .main { justify-self: center; font-size: 19px; padding: 13px 30px; border-radius: 30px; }
  .gate .link { justify-self: center; border: 0; color: #e8d6b8; text-decoration: underline; background: none; }
  .skip.mute { right: auto; left: 16px; }
  [hidden] { display: none !important; }
  .lang { position: absolute; right: 14px; top: 16px; display: flex; gap: 2px; }
  .lang button { padding: 3px 7px; font-size: 12px; border-radius: 6px; }
  .lang button.on, #bot-levels button.on, .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg { display: flex; gap: 4px; } .seg button { flex: 1; }
  .small { font-size: 13px; color: var(--muted); align-self: center; }
  .vbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; opacity: 0; transition: opacity .8s; }
  .vbtns.on { opacity: 1; }
  .vbtns:not(.on) button { pointer-events: none !important; }
  .vbtns button:not(.main) { background: rgba(20,14,8,.55); color: #f6ead6; border-color: rgba(255,255,255,.3); font-size: 17px; padding: 11px 22px; border-radius: 30px; }

  .seat { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; }
  .seat button { padding: 4px 12px; }
  .toggle { display: none; }
  @media (max-width: 700px) {
    .panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46%; padding: 10px 12px; }
    .panel.min .more { display: none; }
    .toggle { display: block; position: absolute; right: 10px; top: 10px; padding: 4px 10px; }
    h1 { font-size: 21px; }
  }
</style>

  </div>
</div>
<div class="intro" id="intro">

  <div class="cap" id="cap"><div class="kk"></div><div class="ru"></div></div>
  <div class="ititle" id="ititle">
    <h1>Ұлы Керуен</h1>

    <button id="i-start" class="main">Ойынды бастау · Начать игру</button>
  </div>
  <button id="i-skip" class="skip">Өткізу · Пропустить ›</button>
  <button id="i-mute" class="skip mute">🔊</button>
</div>
<aside class="panel" id="panel">
  <button class="toggle" id="toggle">▾</button>
  <h1>Ұлы Керуен</h1>
  <div class="sub">Ұлы Жібек жолы · 49 қала</div>
  <div class="lang"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button></div>
  <div class="status" id="status"></div>
  <div class="more">
    <div class="row">
      <button class="main" id="b-new" data-i18n="newGame"></button>
      <button id="b-undo" disabled data-i18n="undo"></button>
    </div>
    <div class="row"><button id="b-intro" data-i18n="intro"></button><button id="b-sound"></button></div>
    <h2 data-i18n="bot"></h2>
    <div class="row three" id="bot-levels">
      <button data-level="1" data-i18n="easy"></button><button data-level="2" class="on" data-i18n="medium"></button><button data-level="3" data-i18n="hard"></button>
    </div>
    <div class="row"><span class="small" data-i18n="playAs"></span>
      <div class="seg" id="bot-side"><button data-side="w" class="on">Ақ</button><button data-side="b">Қоңыр</button></div></div>
    <div class="row"><button id="bot-start" class="main" data-i18n="botStart"></button><button id="bot-stop" hidden data-i18n="botStop"></button></div>
    <p class="note" id="bot-status"></p>
    <h2 data-i18n="view"></h2>
    <div class="row three">
      <button id="v-b">Қоңыр</button>
      <button id="v-top" data-i18n="top"></button>
      <button id="v-w">Ақ</button>
    </div>
    <div class="counts" id="counts"></div>
    <h2 data-i18n="online"></h2>
    <div id="online" hidden>
      <div class="row"><input id="n-code" value="1" maxlength="20" data-i18n-ph="tableNo"><button id="n-join" class="main" data-i18n="sit"></button></div>
      <div id="n-seats" class="seats"></div>
      <p class="note" id="n-status"></p>
      <div class="row"><button id="n-leave" hidden data-i18n="leave"></button></div>
    </div>
    <div id="p2p" hidden>
      <div class="row"><button id="p-host" class="main" data-i18n="createTable"></button><button id="p-join" data-i18n="join"></button></div>
      <div class="row"><input id="p-code" maxlength="4" inputmode="numeric" data-i18n-ph="tableNo"></div>
      <p class="note" id="p-status"></p>
      <p class="note" id="p-turn"></p>
      <div class="row"><button id="p-leave" hidden data-i18n="leave"></button></div>
    </div>
    <p class="note" id="n-off" data-i18n="offline"></p>
    <h2 data-i18n="moves"></h2>
    <ol id="log"></ol>
    <h2 data-i18n="rules"></h2>
    <ul class="rules" id="rules"></ul>
    <p class="note" data-i18n="note"></p>
  </div>
</aside>

function wavyFrame(half, amp) {
  const pts = [], M = 60;
  const corners = [[-half, -half], [half, -half], [half, half], [-half, half]];
  for (let e = 0; e < 4; e++) {
    const [ax, ay] = corners[e], [bx, by] = corners[(e + 1) % 4];
    const nx = (by - ay) / (2 * half), ny = -(bx - ax) / (2 * half);
    for (let j = 0; j < M; j++) {
      const t = j / M, s = Math.sin(t * Math.PI);
      const off = 0.32 * Math.pow(1 - s, 3) + amp * Math.sin(t * Math.PI * 4) * s - 0.1 * s;
      pts.push(new THREE.Vector2(ax + (bx - ax) * t + nx * off, ay + (by - ay) * t + ny * off));
    }
  }
  return pts;
}

  if (!BOT.on || winner || turn !== BOT.side || BOT.busy) return;
  BOT.busy = true; nEl('bot-status').textContent = T('thinking');
  const wait = () => Object.values(objs).some(o => o.userData.seq && o.userData.seq.length);
  const go = () => {
    if (wait()) { setTimeout(go, 200); return; }
    setTimeout(() => {
      const mv = BOT.on && turn === BOT.side && !winner ? chooseBotMove() : null;
      BOT.busy = false; botStatus();
      if (!mv) return;
      select(mv.piece);
      setTimeout(() => { if (BOT.on && turn === BOT.side) move(mv.piece, mv.cell); }, 450);
    }, 60);
  };
  setTimeout(go, 500);
}
const LEVEL_NAME = () => T(['easy', 'medium', 'hard'][BOT.level - 1]);
function botStatus() { nEl('bot-status').textContent = BOT.on ? T('botOn', LEVEL_NAME(), SIDE[BOT.side]) : T('botHint'); nEl('bot-stop').hidden = !BOT.on; }
function startBotGame() {
  if (net.p2p) p2pReset(); if (net.code) leaveTable(true);
  BOT.on = true; BOT.side = BOT.human === 'w' ? 'b' : 'w';
  newGame(); goView(BOT.human); botStatus();
  if (BOT.side === 'w') scheduleBot();
}

// ---------- Start ----------
(async () => {
  try { await Promise.race([document.fonts.load('700 80px "PT Serif"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildDiscs();
  await loadFigures();
  if (!load()) pieces = startPieces();
  for (const p of pieces) { const o = makePiece(p.s, p.t); o.userData.pid = p.id; scene.add(o); objs[p.id] = o; }
  placeAll(false);
  // background camels and people are switched off until realistic models replace the sculpted ones
  // a narrow (portrait) screen needs the camera further back to fit the board
  const aspect = view.clientWidth / view.clientHeight;
  for (const v of Object.values(VIEWS)) { const f = Math.max(1, 1.15 / aspect); v[0] *= f; v[1] *= f; v[2] *= f; }
  camera.position.set(...VIEWS.b);
  applyLang(); document.getElementById('b-sound').textContent = T('sound'); botStatus();
  ui();
  document.getElementById('loading').remove();
  p2pReady();
  requestAnimationFrame(frame_);
})();
</script>
